<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   <!-- in mobile set initial zoom level of page to 100%, set site size to equal device size-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/grid.css" rel="stylesheet" type="text/css">
    <link href="css/main.css" rel="stylesheet" type="text/css">
    <title>Harmoni Guitars</title>
</head>
    <body>
        <h1 class="hidden">Harmoni Guitars - Premium Quality at Discount Prices</h1>
        <header class="grid-con center-grid-con">
            <div id="logo-con" class="box col-start-1 col-end-4 m-col-start-1 m-col-end-3 l-col-start-1 l-col-end-4">Logo</div>
            <div id="nav-con" class="box col-start-4 col-end-6 m-col-start-3 m-col-end-13 l-col-start-4  l-col-end-13">Nav</div>
        </header>
        <main>
            <section id="hero-con" class="grid-con center-grid-con">
                <div class="box col-span-full m-col-span-full l-col-span-full">Hero Image</div>
            </section>
            <section id="about-con" class="grid-con center-grid-con">
                <div class="box col-span-full m-col-start-1 m-col-end-7 l-col-start-1 l-col-end-7">Product 1</div>
                <div class="box col-span-full m-col-start-7 m-col-end-13 l-col-start-7 l-col-end-13">Product 2</div>
            </section>
            <section id="service-con" class="grid-con center-grid-con">
                <div class="box col-start-1 col-end-3 m-col-start-1 m-col-end-5 l-col-start-1 l-col-end-4">Service 1</div>
                <div class="box col-start-3 col-end-5 m-col-start-5 m-col-end-9 l-col-start-4 l-col-end-7">Service 2</div>
                <div class="box col-start-1 col-end-3 m-col-start-9 m-col-end-13 l-col-start-7 l-col-end-10">Service 3</div>
                <div class="box col-start-3 col-end-5 m-col-start-1 m-col-end-5 l-col-start-10 l-col-end-13">Service 4</div>
                <div class="box col-start-1 col-end-3 m-col-start-5 m-col-end-9 l-col-start-1 l-col-end-4">Service 5</div>
                <!-- <div class="boxl-col-start-4 l-col-end-10">Image</div>  -->
                <!-- Seemingly no current way to both 'hide' the div at other sizes, but keep the div present on a desktop size. It is kept hidden. -->
                <div class="box col-start-3 col-end-5 m-col-start-9 m-col-end-13 l-col-start-10 l-col-end-13">Service 6</div>
            </section>
        </main>
        <footer class="grid-con center-grid-con">
            <div id="footer-con" class="box col-span-full m-col-span-full l-co  l-span-full">Footer</div>
        </footer>
        <script src="js/main.js"></script>
    </body>
</html>
